[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["alloc"] }
eqwec-core = { version = "0.0.0", path = "crates/eqwec-core" }
eqwec-security = { version = "0.0.0", path = "crates/eqwec-security" }
semver = "1.0.28"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.1"
thiserror = "2.0.18"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
