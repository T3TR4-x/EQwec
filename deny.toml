# cargo-deny policy for the EQwec workspace.
#
# The project license is not selected yet (ADR-0008). This policy allows the
# permissive and weak-copyleft licenses already approved for evaluation.
# GPL/AGPL/LGPL dependencies require an explicit exception and legal review.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Unmaintained transitive crates with no maintained replacement in the pinned
# GUI stack. None has a known vulnerability. Each entry is re-evaluated when
# winit, accesskit, or zbus releases a fixed version.
ignore = [
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser via winit Wayland decorations (sctk-adwaita); no alternative in winit 0.30" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant via accesskit Linux screen-reader bridge; no fixed release" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names via accesskit Linux screen-reader bridge; no fixed release" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive via accesskit Linux screen-reader bridge; no fixed release" },
]

[licenses]
version = 2
# Workspace crates are publish = false and have no license field until
# ADR-0008 is accepted. Third-party crates are still checked normally.
private = { ignore = true }
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "MPL-2.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "Unlicense",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
